name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Crear archivo .env
        run: touch .env

      - name: Generar Keystore
        run: |
          keytool -genkeypair \
          -keystore my-upload-key.jks \
          -storetype JKS \
          -storepass "${{ secrets.STORE_PASSWORD }}" \
          -keypass "${{ secrets.KEY_PASSWORD }}" \
          -alias "${{ secrets.KEY_ALIAS }}" \
          -dname "CN=Jose Vera, OU=Development, O=Personal, L=Pamplona, ST=Norte de Santander, C=CO" \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000

      - name: Verificar Keystore
        run: |
          keytool -list -v \
            -keystore my-upload-key.jks \
            -storetype JKS \
            -storepass "${{ secrets.STORE_PASSWORD }}"

      - name: Variables
        run: |
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV

      - name: Ver archivos
        run: ls -lah

      - name: Compilar Release
        run: gradle assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Guardar Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key
          path: my-upload-key.jks